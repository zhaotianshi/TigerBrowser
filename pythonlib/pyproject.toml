[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "camoufox"
version = "0.5.8"
description = "Wrapper around Playwright to help launch Camoufox"
authors = ["daijro <daijro.dev@gmail.com>"]
license = "MIT"
repository = "https://github.com/daijro/camoufox"
homepage = "https://camoufox.com/python"
readme = "README.md"
include = [{ path = "camoufox/studio/team/web", format = ["sdist", "wheel"] }]
keywords = [
    "client",
    "fingerprint",
    "browser",
    "scraping",
    "injector",
    "firefox",
    "playwright",
]
classifiers = [
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = "^3.10"
rich-click = "*"
rich = "*"
requests = "*"
orjson = "*"
fpgen = "^1.3.0"
# Keep a ceiling. 1.61 added Juggler params the protocol schema had to learn
# (viewport isMobile/screenSize, webp screenshots, webSocketFrame timestamps)
# and every Playwright minor is free to change Juggler again, while
# camoufox.server imports playwright._impl._driver -- a private API with no
# compat guarantee. Bump deliberately, with launcher and real Studio runtime checks.
playwright = "<1.63"
pyyaml = "*"
platformdirs = "*"
numpy = "*"
ua_parser = "*"
typing_extensions = "*"
screeninfo = "*"
language-tags = "*"
pysocks = "*"
inquirer = "*"
maxminddb = {version = "*", optional = true}
PySide6 = {version = "*", optional = true}
keyring = {version = "^25.7", optional = true}
tzdata = {version = "*", optional = true}
psutil = {version = "^7.2.2", optional = true}
fastapi = {version = "0.142.2", optional = true}
uvicorn = {version = "0.54.0", optional = true}
websockets = {version = "^15.0", optional = true}
cryptography = {version = "50.0.2", optional = true}
python-xlib = {version = "0.33", optional = true, markers = "sys_platform == 'linux'"}

[tool.poetry.extras]
geoip = ["maxminddb"]
studio = ["PySide6", "keyring", "tzdata", "psutil", "cryptography"]
team = ["fastapi", "uvicorn", "websockets", "keyring", "tzdata", "psutil", "cryptography", "python-xlib"]

[tool.poetry.scripts]
camoufox = "camoufox.__main__:cli"
