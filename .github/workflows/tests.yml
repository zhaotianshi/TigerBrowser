name: Tests
run-name: Tests (${{ github.event_name == 'pull_request' && 'full' || inputs.stage }})

on:
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Package targets (every stage runs the shared server checks)
        type: choice
        required: true
        default: server-windows
        options: [server-windows, macos, full]

permissions: {}

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.stage || 'full' }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ci/requirements.txt
      - run: python -m compileall -q pythonlib/camoufox ci scripts
      - run: python -m pytest ci/tests -q
      - name: Select package targets
        id: packages
        env:
          EVENT: ${{ github.event_name }}
          STAGE: ${{ inputs.stage }}
        run: |
          python - <<'PY'
          import json, os
          stage = 'full' if os.environ['EVENT'] == 'pull_request' else os.environ['STAGE']
          if stage not in {'server-windows', 'macos', 'full'}:
              raise SystemExit('Unknown validation stage')
          from ci.studio_release import PLATFORMS
          platforms = [{'platform': platform, 'runner': runner} for platform, runner in PLATFORMS.items()]
          selected = [item for item in platforms if stage == 'full'
                      or item['platform'].startswith('mac-') == (stage == 'macos')]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps({'include': selected}) + '\n')
          PY

  pythonlib:
    name: Python and Studio
    needs: [static, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-studio-frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth libegl1 libgl1 libopengl0
      - run: python -m pip install -r ci/requirements.txt -c pythonlib/team-ci-requirements.lock -e './pythonlib[geoip,studio,team]'
      - run: python scripts/pin-fpgen-model.py
      - run: python -m pip wheel --no-deps ./pythonlib --wheel-dir .ci-work/wheels
      - run: python -m ci.verify_wheel .ci-work/wheels
      - run: python -m ci.run_pythonlib
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QT_QPA_PLATFORM: offscreen

  frontend:
    name: Vue tests and build
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/studio/package-lock.json
      - run: npm ci
      - run: npm run build:probe
      - run: git diff --exit-code -- ../../pythonlib/camoufox/studio/team/probe.js
      - run: npm test
      - run: npm run build

  client-package:
    name: Client package (${{ matrix.platform }})
    needs: [static, pythonlib, frontend]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.static.outputs.packages) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-studio-client
        with:
          platform: ${{ matrix.platform }}

  native:
    name: Linux Vue remote runtime
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CAMOUFOX_KASMVNC_TOOLS: .ci-work/studio-kasmvnc
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-studio-frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create a Python environment shared with the service test account
        run: |
          native_environment="$(mktemp -d /var/tmp/camoufox-studio-native.XXXXXX)"
          python -m venv "$native_environment"
          chmod 0755 "$native_environment"
          echo "$native_environment/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r ci/requirements.txt -c pythonlib/team-ci-requirements.lock './pythonlib[geoip,team]'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool bubblewrap xclip fontconfig dbus-daemon gnome-keyring
      - name: Enable the distribution bubblewrap namespace profile
        run: |
          sudo apt-get install -y apparmor-profiles
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Verify native namespace support
        run: |
          python - <<'PY'
          import subprocess
          from camoufox.studio.team.native import namespace
          subprocess.run([*namespace(), '--', '/usr/bin/true'], check=True)
          PY
      - name: Verify systemd credentials and actual team service restarts
        run: |
          sudo "$(command -v python)" -m pytest service-tester/studio_credentials_tests.py service-tester/studio_server_lifecycle_tests.py -q
      - run: python -m playwright install --with-deps firefox chromium
      - run: python -m camoufox fetch
      - name: Install KasmVNC build and runtime dependencies
        run: |
          python - <<'PY'
          import runpy
          runpy.run_path('scripts/install-studio-kasmvnc.py')['install_system_dependencies']()
          PY
      - uses: actions/cache/restore@v4
        id: kasm-runtime
        with:
          path: .ci-work/studio-kasmvnc
          key: studio-kasmvnc-ubuntu24.04-${{ runner.arch }}-${{ hashFiles('scripts/install-studio-kasmvnc.py', 'scripts/data/studio-kasmvnc*') }}
      - if: steps.kasm-runtime.outputs.cache-hit != 'true'
        run: python scripts/install-studio-kasmvnc.py --prefix "$CAMOUFOX_KASMVNC_TOOLS"
      - uses: actions/cache/save@v4
        if: steps.kasm-runtime.outputs.cache-hit != 'true'
        with:
          path: .ci-work/studio-kasmvnc
          key: ${{ steps.kasm-runtime.outputs.cache-primary-key }}
      - run: python -c "from camoufox.studio.team.kasm import prerequisites; prerequisites()"
      - run: |
          python - <<'PY'
          import os
          from camoufox.studio.distribution import browser_executable
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CAMOUFOX_STUDIO_BINARY=' + str(browser_executable()) + '\n')
          PY
      - run: python -m pytest service-tester/studio_kasm_client_tests.py service-tester/studio_kasm_gateway_tests.py service-tester/studio_native_tests.py::test_last_native_tab_close_allows_restart_with_connected_viewer service-tester/studio_runtime_tests.py::test_web_console_recovers_after_service_restart service-tester/studio_runtime_tests.py::test_console_settings_and_timezone_choices_preserve_saved_values -q --timeout=240
      - name: Show failed KasmVNC build diagnostics
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path.home().glob('.cache/camoufox-studio/kasmvnc/build-*/build.log'):
              print(path)
              print('\n'.join(path.read_text(errors='replace').splitlines()[-100:]))
          PY

  gate:
    name: ${{ (github.event_name == 'pull_request' || inputs.stage == 'full') && 'All tests passed' || format('Selected stage passed ({0})', inputs.stage) }}
    needs: [static, pythonlib, frontend, client-package, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          failed = {name: job['result'] for name, job in json.loads(os.environ['RESULTS']).items()
                    if job['result'] != 'success'}
          if failed:
              raise SystemExit(str(failed))
          print('Every required job passed.')
          PY
